<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<meta property="og:image" content="https://andigh456.github.io/k-mbti/og-image.png" />
<style>
  :root {
    --bg: #0f1016;
    --card: #181a24;
    --card-2: #212433;
    --border: rgba(255,255,255,0.09);
    --text: #f5f6fa;
    --muted: #9aa0b4;
    --accent: #7c6cff;
    --accent-2: #ff6b9d;
    --egen: #ff7eb3;
    --teto: #4cc9f0;
    --good: #38d9a9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: radial-gradient(circle at top, #1d1f30 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.65;
    padding: 18px 14px 48px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  .top-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    color: #c8c2ff;
    text-decoration: none;
    font-weight: 800;
    font-size: 13.5px;
  }
  .nav-links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 12.5px;
  }
  .nav-links a { color: var(--muted); text-decoration: none; }
  .nav-links a.active, .nav-links a:hover { color: #fff; font-weight: 700; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px 18px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.35);
  }
  .pill {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: #c8c2ff;
    background: rgba(124,108,255,0.16);
    border: 1px solid rgba(124,108,255,0.35);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  h1 { font-size: 23px; line-height: 1.3; margin: 0 0 8px; letter-spacing: -0.02em; }
  .sub { font-size: 13.5px; color: var(--muted); margin: 0 0 18px; }
  .hidden { display: none !important; }
  .menu-card {
    display: block;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 10px;
    text-decoration: none;
    color: var(--text);
  }
  .menu-card:hover { border-color: rgba(124,108,255,0.6); }
  .menu-card .t { display: block; font-size: 15.5px; font-weight: 800; margin-bottom: 4px; }
  .menu-card .d { display: block; font-size: 13px; color: var(--muted); }
  .primary-btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .secondary-btn {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    background: var(--card-2);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .opt-btn {
    width: 100%;
    text-align: left;
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .opt-btn:hover { border-color: rgba(124,108,255,0.55); }
  .vs-btn {
    width: 100%;
    padding: 16px 14px;
    border-radius: 16px;
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
  }
  .vs-btn.picked {
    border-color: var(--accent);
    background: rgba(124,108,255,0.22);
  }
  .vs-or {
    text-align: center;
    font-size: 12px;
    font-weight: 900;
    color: var(--accent-2);
    margin: 8px 0;
  }
  .bar-wrap {
    margin-top: 12px;
    background: #232638;
    border-radius: 999px;
    height: 12px;
    overflow: hidden;
    display: flex;
  }
  .bar-a { background: var(--egen); height: 100%; }
  .bar-b { background: var(--teto); height: 100%; }
  .progress {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  .result-box {
    background: rgba(124,108,255,0.12);
    border: 1px solid rgba(124,108,255,0.32);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .toast { text-align: center; font-size: 12.5px; color: var(--good); min-height: 18px; margin-top: 8px; }
  select {
    width: 100%;
    background: var(--card-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    font-size: 14.5px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  footer {
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="top-nav">
    <a class="brand" href="../index.html">🇰🇷 K-MBTI 홈</a>
    <div class="nav-links">
      <a href="index.html" class="">놀이터 홈</a>
<a href="vs.html" class="active">극한 VS</a>
<a href="love-test.html" class="">연애 테스트</a>
<a href="work-test.html" class="">직장 생존</a>
<a href="fortune.html" class="">오늘 운세</a>
    </div>
  </nav>
  
<div class="panel">
  <span class="pill">🔥 극한 밸런스 게임</span>
  <h1>한국인 극한 VS 10라운드</h1>
  <p class="sub">고민하지 말고 3초 안에 딱 하나만 골라보세요!</p>

  <div id="vs-game">
    <div class="progress"><span id="vs-count">1 / 10</span><span id="vs-tag">연애 · 연락</span></div>
    <h2 id="vs-q" style="font-size:18px;margin:0 0 14px;"></h2>
    <button class="vs-btn" id="btn-a" onclick="pickVS('A')"></button>
    <div class="vs-or">VS</div>
    <button class="vs-btn" id="btn-b" onclick="pickVS('B')"></button>

    <div id="vs-stat" class="hidden" style="margin-top:14px;">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;">
        <span style="color:var(--egen)" id="pct-a"></span>
        <span style="color:var(--teto)" id="pct-b"></span>
      </div>
      <div class="bar-wrap"><div class="bar-a" id="bar-a"></div><div class="bar-b" id="bar-b"></div></div>
      <button class="primary-btn" style="margin-top:14px;" onclick="nextVS()">다음 라운드 →</button>
    </div>
  </div>

  <div id="vs-result" class="hidden">
    <div class="result-box">
      <div style="font-size:12px;font-weight:800;color:#c8c2ff;margin-bottom:4px;">당신의 밸런스 판정</div>
      <h2 id="vs-res-title" style="font-size:21px;margin:0 0 8px;"></h2>
      <p id="vs-res-desc" style="font-size:14px;margin:0;color:#dfe3f2;"></p>
    </div>
    <button class="primary-btn" onclick="copyVS()">결과 복사해서 단톡방에 묻기</button>
    <button class="secondary-btn" style="margin-top:8px;" onclick="resetVS()">처음부터 다시 하기</button>
    <div class="toast" id="vs-toast"></div>
  </div>
</div>

<script>
const VS_DATA = [
  { tag:"연애 · 연락", q:"애인이 나 몰래 전 애인 인스타 염탐하다 걸렸을 때", a:"A. 몰래 본 것보다 거짓말한 게 더 빡침", b:"B. 그냥 호기심일 수도 있지, 쿨하게 넘김", pa:68, typeA:"egen", typeB:"teto" },
  { tag:"돈 · 우정", q:"친한 친구가 축의금 5만 원 내고 뷔페 2인분 먹고 감", a:"A. 와준 게 어디야, 고마워하고 끝", b:"B. 내 결혼식 때 적자 본 거 평생 기억함", pa:54, typeA:"egen", typeB:"teto" },
  { tag:"직장 · 돈", q:"연봉 1,000만 원 더 주는데 상사가 매일 감정기복 심함", a:"A. 참는다. 돈이 감정을 치료해 준다", b:"B. 안 간다. 내 멘탈과 수명이 더 비쌈", pa:61, typeA:"teto", typeB:"egen" },
  { tag:"썸 · 고백", q:"호감 있는 상대가 나한테 '너는 그냥 편한 친구 같아'라고 함", a:"A. 속으로 정리 시작. 선 긋고 거리 둠", b:"B. 오히려 오기 생김. 매력 어필해서 뒤집어 봄", pa:72, typeA:"egen", typeB:"teto" },
  { tag:"식사 · 탕수육", q:"회식 자리에서 팀장이 탕수육 소스 말없이 다 부어버림", a:"A. 아... 네 맛있겠네요(속으로 손절)", b:"B. 저 찍먹인데 한 점만 따로 빼놓을 걸 그랬어요~", pa:79, typeA:"egen", typeB:"teto" },
  { tag:"카톡 · 답장", q:"내가 보낸 장문 카톡에 상대가 'ㅇㅇ 알겠어' 5글자 답장", a:"A. 나한테 화났나? 기분 상해서 말 줄임", b:"B. 바쁜가 보네~ 하고 나도 할 일 함", pa:58, typeA:"egen", typeB:"teto" },
  { tag:"여행 · 계획", q:"친구랑 2박 3일 일본 여행 가는데 스타일 차이", a:"A. 분 단위 엑셀 계획표 + 맛집 예약 필수", b:"B. 비행기·숙소만 잡고 현지에서 발길 닿는 대로", pa:47, typeA:"teto", typeB:"egen" },
  { tag:"소비 · 플렉스", q:"갑자기 100만 원 공돈이 생겼다면?", a:"A. 일단 통장·적금에 넣고 숫자로 보면서 흐뭇", b:"B. 갖고 싶던 거 바로 지르고 기분 전환", pa:63, typeA:"teto", typeB:"egen" },
  { tag:"단톡방 · 눈치", q:"단톡방에서 아무도 내 말에 대답 안 하고 2시간 지남", a:"A. 내가 이상한 말 했나? 민망해서 톡방 나감 각", b:"B. 다들 바쁜가 보네~ 신경 1도 안 씀", pa:44, typeA:"egen", typeB:"teto" },
  { tag:"인생 · 선택", q:"평생 하나만 고를 수 있다면?", a:"A. 평생 월 400만 원 불로소득 (일 안 해도 됨)", b:"B. 50% 확률로 100억 받기 (실패 시 0원)", pa:84, typeA:"egen", typeB:"teto" }
];
let idx = 0, scoreE = 0, scoreT = 0, locked = false, resText = "";
function renderVS() {
  const item = VS_DATA[idx];
  locked = false;
  document.getElementById("vs-count").textContent = `${idx + 1} / ${VS_DATA.length}`;
  document.getElementById("vs-tag").textContent = item.tag;
  document.getElementById("vs-q").textContent = item.q;
  document.getElementById("btn-a").textContent = item.a;
  document.getElementById("btn-b").textContent = item.b;
  document.getElementById("btn-a").classList.remove("picked");
  document.getElementById("btn-b").classList.remove("picked");
  document.getElementById("vs-stat").classList.add("hidden");
}
function pickVS(side) {
  if (locked) return;
  locked = true;
  const item = VS_DATA[idx];
  const chosenType = side === "A" ? item.typeA : item.typeB;
  if (chosenType === "egen") scoreE++; else scoreT++;
  document.getElementById(side === "A" ? "btn-a" : "btn-b").classList.add("picked");
  const pb = 100 - item.pa;
  document.getElementById("pct-a").textContent = `A 선택 ${item.pa}%`;
  document.getElementById("pct-b").textContent = `B 선택 ${pb}%`;
  document.getElementById("bar-a").style.width = `${item.pa}%`;
  document.getElementById("bar-b").style.width = `${pb}%`;
  document.getElementById("vs-stat").classList.remove("hidden");
}
function nextVS() {
  idx++;
  if (idx < VS_DATA.length) { renderVS(); return; }
  document.getElementById("vs-game").classList.add("hidden");
  document.getElementById("vs-result").classList.remove("hidden");
  let title = "", desc = "";
  if (scoreE >= 7) {
    title = "💗 관계·감정 우선형 (에겐 감성파)";
    desc = "돈이나 효율보다 내 마음의 평화와 사람 사이의 온도를 훨씬 중요하게 봅니다. 주변에서 '같이 있으면 편한 사람' 소리를 자주 듣지만, 속으로 상처를 혼자 삼키는 편이에요.";
  } else if (scoreT >= 7) {
    title = "⚡ 실속·직진 돌파형 (테토 현실파)";
    desc = "감정 소모는 딱 질색이고, 손익과 결론이 빠릅니다. 쓸데없는 눈치 안 보고 내 페이스대로 사는 멘탈 강자! 가끔 너무 쿨해서 주변이 당황할 때가 있어요.";
  } else {
    title = "⚖️ 상황 맞춤형 눈치 100단 (반반 하이브리드)";
    desc = "감정과 현실 사이에서 가장 영리하게 줄타기를 합니다. 챙길 건 챙기고, 넘길 건 쿨하게 넘기는 한국 사회 최적화 밸런스 캐릭터!";
  }
  document.getElementById("vs-res-title").textContent = title;
  document.getElementById("vs-res-desc").textContent = desc;
  resText = `[K-MBTI 극한 VS 결과]\n${title}\n(감성 ${scoreE} : 현실 ${scoreT})\n👉 너도 해봐: ${window.location.href}`;
}
async function copyVS() {
  try { await navigator.clipboard.writeText(resText); } catch {}
  document.getElementById("vs-toast").textContent = "복사 완료! 단톡방에 붙여넣고 친구들이랑 싸워보세요 ㅋㅋ";
}
function resetVS() {
  idx = 0; scoreE = 0; scoreT = 0;
  document.getElementById("vs-result").classList.add("hidden");
  document.getElementById("vs-game").classList.remove("hidden");
  document.getElementById("vs-toast").textContent = "";
  renderVS();
}
renderVS();
</script>

  <footer>
    © K-MBTI · <a href="../index.html">메인 테스트</a> · <a href="../guides/index.html">성격 도감</a>
  </footer>
</div>
</body>
</html>
