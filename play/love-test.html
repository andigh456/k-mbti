  :root {
    --bg: #0f1016;
    --card: #181a24;
    --card-2: #212433;
    --border: rgba(255,255,255,0.09);
    --text: #f5f6fa;
    --muted: #9aa0b4;
    --accent: #7c6cff;
    --accent-2: #ff6b9d;
    --egen: #ff7eb3;
    --teto: #4cc9f0;
    --good: #38d9a9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: radial-gradient(circle at top, #1d1f30 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.65;
    padding: 18px 14px 48px;

  .top-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    padding-bottom: 12px;

  }
  .brand {
    color: #c8c2ff;
    text-decoration: none;
    font-weight: 800;
    font-size: 13.5px;
  }
  .nav-links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 12.5px;
  }
  .nav-links a { color: var(--muted); text-decoration: none; }
  .nav-links a.active, .nav-links a:hover { color: #fff; font-weight: 700; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px 18px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.35);
  }
  .pill {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: #c8c2ff;
    background: rgba(124,108,255,0.16);
    border: 1px solid rgba(124,108,255,0.35);
    padding: 4px 10px;

    margin-bottom: 10px;
  }
  h1 { font-size: 23px; line-height: 1.3; margin: 0 0 8px; letter-spacing: -0.02em; }
  .sub { font-size: 13.5px; color: var(--muted); margin: 0 0 18px; }
  .hidden { display: none !important; }
  .menu-card {
    display: block;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 10px;
    text-decoration: none;
    color: var(--text);
  }
  .menu-card:hover { border-color: rgba(124,108,255,0.6); }
  .menu-card .t { display: block; font-size: 15.5px; font-weight: 800; margin-bottom: 4px; }
  .menu-card .d { display: block; font-size: 13px; color: var(--muted); }
  .primary-btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .secondary-btn {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    background: var(--card-2);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .opt-btn {
    width: 100%;
    text-align: left;
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .opt-btn:hover { border-color: rgba(124,108,255,0.55); }
  .vs-btn {
    width: 100%;
    padding: 16px 14px;
    border-radius: 16px;
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
  }
  .vs-btn.picked {
    border-color: var(--accent);
    background: rgba(124,108,255,0.22);
  }
  .vs-or {
    text-align: center;
    font-size: 12px;
    font-weight: 900;
    color: var(--accent-2);
    margin: 8px 0;
  }
  .bar-wrap {
    margin-top: 12px;
    background: #232638;
    border-radius: 999px;
    height: 12px;
    overflow: hidden;
    display: flex;
  }
  .bar-a { background: var(--egen); height: 100%; }
  .bar-b { background: var(--teto); height: 100%; }
  .progress {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  .result-box {
    background: rgba(124,108,255,0.12);
    border: 1px solid rgba(124,108,255,0.32);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .toast { text-align: center; font-size: 12.5px; color: var(--good); min-height: 18px; margin-top: 8px; }
  select {
    width: 100%;
    background: var(--card-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    font-size: 14.5px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  footer {
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="top-nav">
    <a class="brand" href="../index.html">🇰🇷 K-MBTI 홈</a>
    <div class="nav-links">
      <a href="index.html" class="">놀이터 홈</a>
<a href="vs.html" class="">극한 VS</a>
<a href="love-test.html" class="active">연애 테스트</a>

    </div>
  </nav>
  
<div class="panel">
  <span class="pill">💘 연애 심층 미니 테스트</span>
  <h1>내 연애 찌질력 &amp; 썸 직진력</h1>
  <p class="sub">썸 탈 때 내 머릿속 실제 반응으로 보는 연애 포지션 (7문항)</p>
  <div id="quiz-box">
    <div class="progress"><span id="q-cnt">1 / 7</span><span>연애 시뮬레이션</span></div>
    <h2 id="q-txt" style="font-size:17.5px;margin:0 0 14px;"></h2>
    <div id="q-opts"></div>
  </div>
  <div id="res-box" class="hidden">
    <div class="result-box">
      <div id="r-badge" style="font-size:12px;font-weight:800;color:#ff9ec0;margin-bottom:4px;"></div>
      <h2 id="r-title" style="font-size:21px;margin:0 0 8px;"></h2>
      <p id="r-desc" style="font-size:14px;margin:0;color:#dfe3f2;"></p>
    </div>
    <button class="primary-btn" onclick="copyRes()">결과 복사해서 친구한테 보내기</button>
    <button class="secondary-btn" style="margin-top:8px;" onclick="location.reload()">다시 하기</button>
    <div class="toast" id="r-toast"></div>
  </div>
</div>
<script>
const QS = [
  { q:"썸남/썸녀가 내 카톡을 3시간째 안 읽고 인스타 스토리는 올렸다.", opts:[
    { t:"모르는 척 나도 스토리 올리고 맞불 작전", s:2 },
    { t:"바쁘겠지... 하면서 10분에 한 번씩 폰 확인", s:3 },
    { t:"관심 없나 보네~ 하고 다른 일 보러 감", s:0 }
  ]},
  { q:"첫 데이트 끝나고 집 가는 길, 어색해서 침묵이 흐른다.", opts:[
    { t:"오늘 너무 재밌었어요! 조만간 또 봐요 먼저 던짐", s:0 },
    { t:"집 가서 뭐라고 카톡 보내지 머릿속으로 초안 3개 씀", s:3 },
    { t:"아무 말 없이 이어폰 끼고 싶지만 예의상 웃고 있음", s:2 }
  ]},
  { q:"사귀기 직전, 상대가 '우리 무슨 사이야?'라고 먼저 물었다.", opts:[
    { t:"오늘부터 1일 할래요? 바로 직진 고백", s:0 },
    { t:"너는 어떻게 생각하는데? 공을 다시 넘김", s:2 },
    { t:"갑자기 심장 뛰어서 말 더듬고 농담으로 얼버무림", s:3 }
  ]},
  { q:"연인이 이유 없이 하루 종일 말투가 차갑다.", opts:[
    { t:"무슨 일 있어? 서운한 거 있으면 바로 말해줘 직구", s:0 },
    { t:"내가 어제 뭘 잘못했나 카톡 대화창 위로 300줄 복기", s:3 },
    { t:"나도 똑같이 말투 차갑게 바꾸고 눈치 싸움", s:2 }
  ]},
  { q:"전 애인한테 새벽 2시에 '자니?' 카톡이 왔다.", opts:[
    { t:"읽씹 후 차단. 깔끔", s:0 },
    { t:"일단 뭐라고 보냈는지 궁금해서 미리보기로 훔쳐봄", s:2 },
    { t:"답장은 안 하는데 다음 날까지 왜 보냈을까 생각함", s:3 }
  ]},
  { q:"마음에 드는 사람에게 선물을 줄 때 내 스타일은?", opts:[
    { t:"평소 지나가듯 말한 거 기억해 뒀다가 서프라이즈", s:1 },
    { t:"뭐 갖고 싶냐고 물어보고 제일 좋은 거 사줌", s:0 },
    { t:"부담스러울까 봐 가격표 떼고 편지 쓰다 3번 찢음", s:3 }
  ]},
  { q:"이별 후 내 회복 패턴은?", opts:[
    { t:"딱 3일 울고 친구들이랑 놀면서 바로 털어냄", s:0 },
    { t:"낮엔 멀쩡한 척하다 밤 12시 넘으면 플레이리스트 켬", s:3 },
    { t:"상대 인스타 안 보려고 앱을 며칠 지워둠", s:2 }
  ]}
];
let qi = 0, total = 0, copyTxt = "";
function draw() {
  const cur = QS[qi];
  document.getElementById("q-cnt").textContent = `${qi+1} / ${QS.length}`;
  document.getElementById("q-txt").textContent = cur.q;
  const box = document.getElementById("q-opts");
  box.innerHTML = "";
  cur.opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt-btn";
    b.textContent = o.t;
    b.onclick = () => {
      total += o.s;
      qi++;
      if (qi < QS.length) draw(); else finish();
    };
    box.appendChild(b);
  });
}
function finish() {
  document.getElementById("quiz-box").classList.add("hidden");
  document.getElementById("res-box").classList.remove("hidden");
  let badge="", title="", desc="";
  if (total <= 5) {
    badge = "직진력 92% · 찌질력 8%";
    title = "⚡ 노빠꾸 직진 연애 마스터";
    desc = "재고 따지는 밀당은 시간 낭비! 좋으면 좋다, 아니면 아니다가 확실해서 썸을 제일 빨리 연애로 연결하는 타입입니다. 다만 가끔 너무 쿨해서 상대가 '나 안 좋아하나?' 헷갈릴 수 있어요.";
  } else if (total <= 13) {
    badge = "직진력 55% · 찌질력 45%";
    title = "🦊 겉쿨 속여린 밀당 요정";
    desc = "겉으로는 쿨하고 여유로운 척하지만, 집에 오면 카톡 말투 하나에 혼자 분석 회의 여는 타입! 상대에 대한 배려가 깊어서 오래 연애할수록 진가가 나옵니다.";
  } else {
    badge = "직진력 18% · 찌질력 82%";
    title = "🥺 과몰입 순정 시뮬레이터";
    desc = "좋아하는 사람 앞에만 서면 머릿속에서 100가지 시나리오가 동시에 돌아갑니다. 진심이 너무 크다 보니 혼자 끙끙 앓는 편! 가끔은 생각의 절반만 말로 꺼내도 연애가 훨씬 쉬워져요.";
  }
  document.getElementById("r-badge").textContent = badge;
  document.getElementById("r-title").textContent = title;
  document.getElementById("r-desc").textContent = desc;
  copyTxt = `[연애 찌질력 테스트]\n${title} (${badge})\n👉 너도 해봐: ${window.location.href}`;
}
async function copyRes() {
  try { await navigator.clipboard.writeText(copyTxt); } catch {}
  document.getElementById("r-toast").textContent = "복사 완료!";
}
draw();
</script>

  <footer>
    © K-MBTI · <a href="../index.html">메인 테스트</a> · <a href="../guides/index.html">성격 도감</a>
  </footer>
</div>
