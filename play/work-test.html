<style>
  :root {
    --bg: #0f1016;
    --card: #181a24;
    --card-2: #212433;
    --border: rgba(255,255,255,0.09);
    --text: #f5f6fa;
    --muted: #9aa0b4;
    --accent: #7c6cff;
    --accent-2: #ff6b9d;
    --egen: #ff7eb3;
    --teto: #4cc9f0;
    --good: #38d9a9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: radial-gradient(circle at top, #1d1f30 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.65;
    padding: 18px 14px 48px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  .top-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    color: #c8c2ff;
    text-decoration: none;
    font-weight: 800;
    font-size: 13.5px;
  }
  .nav-links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 12.5px;
  }
  .nav-links a { color: var(--muted); text-decoration: none; }
  .nav-links a.active, .nav-links a:hover { color: #fff; font-weight: 700; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px 18px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.35);
  }
  .pill {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: #c8c2ff;
    background: rgba(124,108,255,0.16);
    border: 1px solid rgba(124,108,255,0.35);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  h1 { font-size: 23px; line-height: 1.3; margin: 0 0 8px; letter-spacing: -0.02em; }
  .sub { font-size: 13.5px; color: var(--muted); margin: 0 0 18px; }
  .hidden { display: none !important; }
  .menu-card {
    display: block;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 10px;
    text-decoration: none;
    color: var(--text);
  }
  .menu-card:hover { border-color: rgba(124,108,255,0.6); }
  .menu-card .t { display: block; font-size: 15.5px; font-weight: 800; margin-bottom: 4px; }
  .menu-card .d { display: block; font-size: 13px; color: var(--muted); }
  .primary-btn {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .secondary-btn {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    background: var(--card-2);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .opt-btn {
    width: 100%;
    text-align: left;
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .opt-btn:hover { border-color: rgba(124,108,255,0.55); }
  .vs-btn {
    width: 100%;
    padding: 16px 14px;
    border-radius: 16px;
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
  }
  .vs-btn.picked {
    border-color: var(--accent);
    background: rgba(124,108,255,0.22);
  }
  .vs-or {
    text-align: center;
    font-size: 12px;
    font-weight: 900;
    color: var(--accent-2);
    margin: 8px 0;
  }
  .bar-wrap {
    margin-top: 12px;
    background: #232638;
    border-radius: 999px;
    height: 12px;
    overflow: hidden;
    display: flex;
  }
  .bar-a { background: var(--egen); height: 100%; }
  .bar-b { background: var(--teto); height: 100%; }
  .progress {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  .result-box {
    background: rgba(124,108,255,0.12);
    border: 1px solid rgba(124,108,255,0.32);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .toast { text-align: center; font-size: 12.5px; color: var(--good); min-height: 18px; margin-top: 8px; }
  select {
    width: 100%;
    background: var(--card-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    font-size: 14.5px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  footer {
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="top-nav">
    <a class="brand" href="../index.html">🇰🇷 K-MBTI 홈</a>
    <div class="nav-links">
      <a href="index.html" class="">놀이터 홈</a>
<a href="vs.html" class="">극한 VS</a>

<a href="fortune.html" class="">오늘 운세</a>
    </div>
  </nav>
  
<div class="panel">
  <span class="pill">💼 K-직장인 생존 유형</span>
  <h1>출근~퇴근 내 진짜 생존 캐릭터</h1>
  <p class="sub">회사·알바·학교에서 살아남는 나만의 방식 (7문항)</p>
  <div id="quiz-box">
    <div class="progress"><span id="q-cnt">1 / 7</span><span>생존 시뮬레이션</span></div>
    <h2 id="q-txt" style="font-size:17.5px;margin:0 0 14px;"></h2>
    <div id="q-opts"></div>
  </div>
  <div id="res-box" class="hidden">
    <div class="result-box">
      <div id="r-badge" style="font-size:12px;font-weight:800;color:#6ee7b7;margin-bottom:4px;"></div>
      <h2 id="r-title" style="font-size:21px;margin:0 0 8px;"></h2>
      <p id="r-desc" style="font-size:14px;margin:0;color:#dfe3f2;"></p>
    </div>
    <button class="primary-btn" onclick="copyRes()">결과 복사하기</button>
    <button class="secondary-btn" style="margin-top:8px;" onclick="location.reload()">다시 하기</button>
    <div class="toast" id="r-toast"></div>
  </div>
</div>
<script>
const QS = [
  { q:"월요일 아침 8시 55분, 출근길 내 머릿속은?", opts:[
    { t:"오늘 점심 뭐 먹지? 메뉴부터 정해야 버팀", k:"chill" },
    { t:"오늘 끝내야 할 일 3개 머릿속으로 체크리스트 정리", k:"pro" },
    { t:"아... 로또만 되면 바로 사표 던지는데", k:"ghost" }
  ]},
  { q:"상사(또는 팀장)가 퇴근 15분 전에 '이거 급한데 오늘 중으로 되나?'라고 한다.", opts:[
    { t:"내일 오전 9시까지 깔끔하게 드리겠습니다! 선 방어", k:"pro" },
    { t:"표정 관리 0.5초 실패 후 어쩔 수 없이 자리 앉음", k:"chill" },
    { t:"일단 알겠다 하고 10분 만에 대충 형태만 맞춰 보냄", k:"ghost" }
  ]},
  { q:"회식/모임 자리에서 내가 주로 맡는 포지션은?", opts:[
    { t:"고기 굽거나 잔 챙기며 분위기 맞추는 사회생활 만렙", k:"pro" },
    { t:"조용히 맛있는 반찬만 공략하고 1차 후 귀가 각", k:"ghost" },
    { t:"옆 사람하고 수다 떨다 웃음벨 터뜨리는 담당", k:"chill" }
  ]},
  { q:"월급날 통장에 돈이 들어왔다. 제일 먼저 하는 행동은?", opts:[
    { t:"고정비·적금 자동이체 빠진 잔액부터 계산", k:"pro" },
    { t:"장바구니에 담아뒀던 거 하나 결제해서 보상", k:"chill" },
    { t:"로그아웃. 스쳐 지나가는 숫자에 정 안 줌", k:"ghost" }
  ]},
  { q:"동료가 나한테 일 떠넘기려고 슬슬 밑밥을 깐다.", opts:[
    { t:"어, 나도 지금 이거 급해서! 바로 선 차단", k:"pro" },
    { t:"눈치 챘는데 거절 못 하고 일단 들어주는 중", k:"chill" },
    { t:"못 들은 척 이어폰 끼고 모니터만 뚫어져라 봄", k:"ghost" }
  ]},
  { q:"내가 제일 스트레스 받는 순간은?", opts:[
    { t:"일정·지시가 계속 바뀌어서 내 계획이 꼬일 때", k:"pro" },
    { t:"할 일은 없는데 퇴근 못 하고 자리 지켜야 할 때", k:"ghost" },
    { t:"분위기 험악해져서 눈치 보일 때", k:"chill" }
  ]},
  { q:"퇴근 벨 울리자마자 내 모습은?", opts:[
    { t:"내일 할 일 메모 1줄 남기고 칼퇴", k:"pro" },
    { t:"이미 5분 전부터 가방 싸고 엘리베이터 앞 대기", k:"ghost" },
    { t:"친구한테 '오늘 뭐 먹지?' 톡 보내며 걸어나감", k:"chill" }
  ]}
];
let qi = 0, cnt = { pro:0, chill:0, ghost:0 }, copyTxt = "";
function draw() {
  const cur = QS[qi];
  document.getElementById("q-cnt").textContent = `${qi+1} / ${QS.length}`;
  document.getElementById("q-txt").textContent = cur.q;
  const box = document.getElementById("q-opts");
  box.innerHTML = "";
  cur.opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt-btn";
    b.textContent = o.t;
    b.onclick = () => {
      cnt[o.k]++;
      qi++;
      if (qi < QS.length) draw(); else finish();
    };
    box.appendChild(b);
  });
}
function finish() {
  document.getElementById("quiz-box").classList.add("hidden");
  document.getElementById("res-box").classList.remove("hidden");
  const top = Object.entries(cnt).sort((a,b) => b[1]-a[1])[0][0];
  let badge="", title="", desc="";
  if (top === "pro") {
    badge = "일잘러 생존력 95%";
    title = "🛡️ 철벽 방어 프로 일잘러";
    desc = "할 일은 깔끔하게 쳐내면서도 부당한 야근·떠넘기기는 절대 안 당하는 스마트 생존형! 주변에서 '일 진짜 잘한다' 소리를 듣지만 속으론 번아웃 안 오게 잘 쉬어줘야 해요.";
  } else if (top === "chill") {
    badge = "분위기 회복력 90%";
    title = "☕ 인간 비타민 월급루팡 희망러";
    desc = "일보다 사람이 먼저! 적당히 일하고 적당히 웃기면서 하루를 버텨내는 유연한 생존가입니다. 맛있는 점심과 퇴근 후 한 잔이 인생의 원동력!";
  } else {
    badge = "투명인간 스킬 MAX";
    title = "🥷 무존재감 칼퇴 닌자";
    desc = "회사에선 최소 에너지만 쓰고 퇴근 후 내 진짜 삶에 올인하는 타입! 시키면 딱 시킨 만큼만 정확히 하고 바람처럼 사라지는 고수입니다.";
  }
  document.getElementById("r-badge").textContent = badge;
  document.getElementById("r-title").textContent = title;
  document.getElementById("r-desc").textContent = desc;
  copyTxt = `[K-직장인 생존 유형]\n${title} (${badge})\n👉 너도 해봐: ${window.location.href}`;
}
async function copyRes() {
  try { await navigator.clipboard.writeText(copyTxt); } catch {}
  document.getElementById("r-toast").textContent = "복사 완료!";
}
draw();
</script>

</div>
