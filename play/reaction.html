<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>⚡ 오늘의 반응속도 3판 | K-MBTI 놀이터</title>
<meta name="description" content="매일 모두가 같은 조건으로 겨루는 30초 반응속도 3판 테스트. 오늘 내 반사신경은 상위 몇 %일까요?" />
<meta property="og:title" content="⚡ 오늘의 반응속도 3판 | K-MBTI" />
<meta property="og:description" content="매일 똑같은 3판으로 단톡방 순위 대결! 나는 몇 ms 나올까?" />
<meta property="og:image" content="https://andigh456.github.io/k-mbti/og-image.png" />
<style>
  :root {
    --bg: #0c0d14;
    --card: #161826;
    --card-2: #1e2133;
    --border: rgba(255,255,255,0.09);
    --text: #f3f4fa;
    --muted: #9aa0b8;
    --accent: #7c6cff;
    --egen: #6bc4ff;
    --teto: #ff6b9d;
    --good: #38d9a9;
    --warn: #ffd43b;
    --danger: #ff5757;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    margin: 0;
    background: radial-gradient(circle at top, #1b1d35 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    min-height: 100dvh;
    padding: 14px 14px 40px;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  .top-nav {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .top-nav a.brand { font-weight: 800; color: var(--text); text-decoration: none; font-size: 14px; }
  .nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav-links a {
    font-size: 11.5px; color: var(--muted); text-decoration: none;
    padding: 5px 9px; border-radius: 999px;
    border: 1px solid var(--border); background: rgba(255,255,255,0.03);
  }
  .nav-links a.active {
    color: #fff; background: rgba(124,108,255,0.28); border-color: rgba(124,108,255,0.55);
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px 18px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.38);
  }
  .pill {
    display: inline-block; padding: 4px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700;
    background: rgba(56,217,169,0.16); color: var(--good);
    border: 1px solid rgba(56,217,169,0.38); margin-bottom: 10px;
  }
  h1 { font-size: 22px; line-height: 1.3; margin: 0 0 6px; letter-spacing: -0.4px; }
  p.sub { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin: 0 0 14px; }

  .meta-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--muted); font-weight: 700;
    margin-bottom: 10px;
  }
  .round-dots { display: flex; gap: 6px; }
  .r-dot {
    padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 800;
    background: var(--card-2); border: 1px solid var(--border); color: var(--muted);
  }
  .r-dot.done { background: rgba(56,217,169,0.18); border-color: rgba(56,217,169,0.45); color: var(--good); }
  .r-dot.active { background: rgba(124,108,255,0.25); border-color: var(--accent); color: #fff; }

  .arena {
    width: 100%;
    height: 250px;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    cursor: pointer;
    transition: background 0.12s ease, transform 0.08s ease;
    border: 2px solid var(--border);
    margin-bottom: 14px;
    touch-action: manipulation;
  }
  .arena:active { transform: scale(0.985); }
  .arena.idle { background: linear-gradient(135deg, #22253a, #191b2b); }
  .arena.wait { background: linear-gradient(135deg, #6b1d33, #4a1324); border-color: rgba(255,107,157,0.5); }
  .arena.go { background: linear-gradient(135deg, #10b981, #059669); border-color: #6ee7b7; color: #042f2e; }
  .arena.early { background: linear-gradient(135deg, #92400e, #78350f); border-color: var(--warn); }
  .arena.round-done { background: linear-gradient(135deg, #272b45, #1e2133); border-color: var(--accent); }

  .arena-emoji { font-size: 42px; margin-bottom: 8px; line-height: 1; }
  .arena-title { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
  .arena-sub { font-size: 13.5px; opacity: 0.88; font-weight: 600; }

  .result-box {
    background: rgba(124,108,255,0.12);
    border: 1px solid rgba(124,108,255,0.34);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    display: none;
  }
  .result-box.show { display: block; }
  .avg-ms { font-size: 36px; font-weight: 900; color: var(--good); line-height: 1.1; }
  .tier-name { font-size: 17px; font-weight: 800; margin: 6px 0 4px; }
  .rounds-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px;
  }
  .round-cell {
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px; text-align: center;
  }
  .round-cell .lbl { font-size: 11px; color: var(--muted); }
  .round-cell .val { font-size: 14px; font-weight: 800; color: #fff; margin-top: 2px; }

  .btn-stack { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .primary-btn, .secondary-btn {
    width: 100%; border: none; border-radius: 13px; padding: 13px 12px;
    font-size: 14px; font-weight: 800; cursor: pointer;
  }
  .primary-btn { background: linear-gradient(135deg, #7c6cff, #9b6cff); color: #fff; }
  .secondary-btn { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
  .toast { text-align: center; font-size: 12.5px; color: var(--good); min-height: 18px; margin-top: 8px; font-weight: 700; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(6,7,12,0.85);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 30;
  }
  .modal-bg.show { display: flex; }
  .modal-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 16px; max-width: 380px; width: 100%; text-align: center;
  }
  .modal-card img { width: 100%; border-radius: 12px; margin: 10px 0; border: 1px solid var(--border); }
  footer { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="top-nav">
    <a class="brand" href="../index.html">🇰🇷 K-MBTI 홈</a>
    <div class="nav-links">
      <a href="index.html">놀이터 홈</a>
      <a href="reaction.html" class="active">반응속도</a>
      <a href="vs.html">극한 VS</a>
      <a href="love-test.html">연애 테스트</a>
      <a href="work-test.html">직장 생존</a>
    </div>
  </nav>

  <div class="panel">
    <span class="pill" id="today-badge">⚡ 오늘의 데일리 3판</span>
    <h1>오늘의 반응속도 3판</h1>
    <p class="sub">매일 한국시간 기준 <strong>모두가 똑같은 타이밍</strong>으로 3판 겨뤄요. 초록불 켜지자마자 바로 터치!</p>

    <div class="meta-row">
      <span id="best-line">오늘 최고 기록: -</span>
      <div class="round-dots" id="round-dots">
        <span class="r-dot active" id="dot-0">1판</span>
        <span class="r-dot" id="dot-1">2판</span>
        <span class="r-dot" id="dot-2">3판</span>
      </div>
    </div>

    <div class="arena idle" id="arena">
      <div class="arena-emoji" id="a-emoji">⚡</div>
      <div class="arena-title" id="a-title">여기를 눌러 1판 시작</div>
      <div class="arena-sub" id="a-sub">3판 평균(ms)으로 오늘 내 반사신경을 측정합니다</div>
    </div>

    <div class="result-box" id="result-box">
      <div style="font-size:12px;color:var(--muted);font-weight:700;" id="res-date-lbl">오늘 평균 기록</div>
      <div class="avg-ms" id="res-avg">240 ms</div>
      <div class="tier-name" id="res-tier">🔥 고인물 반사신경</div>
      <div style="font-size:13px;color:#dfe3f2;line-height:1.5;" id="res-desc"></div>
      <div class="rounds-grid" id="rounds-grid"></div>

      <div class="btn-stack">
        <button class="primary-btn" id="btn-share">단톡방 기록 복사</button>
        <button class="secondary-btn" id="btn-img">기록 카드 저장</button>
      </div>
      <div class="btn-stack">
        <button class="secondary-btn" id="btn-retry">3판 다시 도전</button>
        <a href="../index.html" class="secondary-btn" style="text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;">성격 테스트 하러가기</a>
      </div>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <footer>
    © K-MBTI · <a href="../index.html">메인 테스트</a> · <a href="../guides/index.html">성격 도감</a>
  </footer>
</div>

<div class="modal-bg" id="img-modal" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="modal-card">
    <strong style="font-size:15px;">📸 기록 카드 (꾹 눌러 저장)</strong>
    <img id="modal-img" alt="오늘의 반응속도 기록" />
    <button class="secondary-btn" onclick="document.getElementById('img-modal').classList.remove('show')">닫기</button>
  </div>
</div>

<script>
(() => {
  const nowKst = new Date(Date.now() + 9 * 3600 * 1000);
  const yyyy = nowKst.getUTCFullYear();
  const mm = String(nowKst.getUTCMonth() + 1).padStart(2, '0');
  const dd = String(nowKst.getUTCDate()).padStart(2, '0');
  const todayKey = `${yyyy}-${mm}-${dd}`;
  document.getElementById('today-badge').textContent = `⚡ ${mm}/${dd} 데일리 3판`;

  // Deterministic daily seed so everyone gets the exact same 3 wait timings today
  function dailyDelays(dateStr) {
    let h = 2166136261;
    for (let i = 0; i < dateStr.length; i++) {
      h ^= dateStr.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    const delays = [];
    for (let r = 0; r < 3; r++) {
      h ^= (r + 1) * 7919;
      h = Math.imul(h, 16777619);
      const norm = ((h >>> 0) % 2400); // 0..2399ms
      delays.push(1400 + norm); // 1.4s ~ 3.8s
    }
    return delays;
  }

  const DELAYS = dailyDelays(todayKey);
  const STORAGE_KEY = `kmbti_reaction_best_${todayKey}`;
  let bestToday = Number(localStorage.getItem(STORAGE_KEY) || 0);

  const arena = document.getElementById('arena');
  const aEmoji = document.getElementById('a-emoji');
  const aTitle = document.getElementById('a-title');
  const aSub = document.getElementById('a-sub');
  const bestLine = document.getElementById('best-line');
  const resultBox = document.getElementById('result-box');
  const toastEl = document.getElementById('toast');

  function updateBestLabel() {
    bestLine.textContent = bestToday > 0 ? `오늘 최고 기록: ${bestToday} ms` : '오늘 최고 기록: -';
  }
  updateBestLabel();

  let state = 'idle'; // idle | wait | go | early | round-done | finished
  let roundIdx = 0;
  let scores = [];
  let waitTimer = null;
  let goAt = 0;
  let lastAvg = 0;
  let lastTier = null;

  function renderDots() {
    for (let i = 0; i < 3; i++) {
      const el = document.getElementById(`dot-${i}`);
      el.className = 'r-dot';
      if (i < scores.length) {
        el.classList.add('done');
        el.textContent = `${scores[i]}ms`;
      } else if (i === roundIdx && state !== 'finished') {
        el.classList.add('active');
        el.textContent = `${i + 1}판`;
      } else {
        el.textContent = `${i + 1}판`;
      }
    }
  }

  function setArena(mode, emoji, title, sub) {
    state = mode;
    arena.className = `arena ${mode}`;
    aEmoji.textContent = emoji;
    aTitle.textContent = title;
    aSub.textContent = sub;
  }

  function startRound() {
    clearTimeout(waitTimer);
    setArena('wait', '🔴', `대기... (${roundIdx + 1} / 3)`, '초록불로 바뀌면 바로 터치하세요!');
    renderDots();
    waitTimer = setTimeout(() => {
      goAt = performance.now();
      setArena('go', '🟢', '지금 터치!', '빨리!!');
    }, DELAYS[roundIdx]);
  }

  function judgeTier(avg) {
    if (avg < 200) return { title: '⚡ 인간 번개 (상위 1%)', desc: '이 정도면 프로게이머급 반사신경! 단톡방에 올리면 바로 인증샷 요구 들어옵니다.' };
    if (avg < 245) return { title: '🔥 고인물 반사신경 (상위 10%)', desc: '눈으로 보고 손이 바로 움직이는 수준이에요. 웬만한 친구들한테는 절대 안 집니다.' };
    if (avg < 295) return { title: '😎 평균 이상 훈수러 (상위 35%)', desc: '깔끔하고 안정적인 반응속도! 한 판만 더 집중하면 240ms대 진입 가능합니다.' };
    if (avg < 360) return { title: '🐢 느긋한 감성파 (상위 65%)', desc: '급할 거 없이 여유로운 타입이네요. 커피 한 잔 마시고 다시 재보면 확 줄어요!' };
    return { title: '🦥 멍때리기 장인', desc: '지금 살짝 졸리시거나 딴생각 중이셨죠? 기지개 한 번 켜고 바로 재도전!' };
  }

  function finishGame() {
    state = 'finished';
    const sum = scores.reduce((a, b) => a + b, 0);
    lastAvg = Math.round(sum / 3);
    lastTier = judgeTier(lastAvg);

    if (bestToday === 0 || lastAvg < bestToday) {
      bestToday = lastAvg;
      localStorage.setItem(STORAGE_KEY, String(bestToday));
      updateBestLabel();
    }

    setArena('round-done', '🏆', `평균 ${lastAvg} ms`, '아래에서 기록 공유 또는 재도전!');
    document.getElementById('res-date-lbl').textContent = `${mm}/${dd} 데일리 3판 평균`;
    document.getElementById('res-avg').textContent = `${lastAvg} ms`;
    document.getElementById('res-tier').textContent = lastTier.title;
    document.getElementById('res-desc').textContent = lastTier.desc;

    const grid = document.getElementById('rounds-grid');
    grid.innerHTML = scores.map((s, i) => `
      <div class="round-cell">
        <div class="lbl">${i + 1}판</div>
        <div class="val">${s} ms</div>
      </div>
    `).join('');

    resultBox.classList.add('show');
    renderDots();
  }

  arena.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state === 'idle' || state === 'round-done' || state === 'early') {
      if (state === 'idle') resultBox.classList.remove('show');
      startRound();
      return;
    }
    if (state === 'wait') {
      clearTimeout(waitTimer);
      setArena('early', '😅', '너무 빨랐어요!', '초록불 켜진 뒤에 눌러주세요 · 터치해서 다시 시도');
      return;
    }
    if (state === 'go') {
      const ms = Math.max(80, Math.round(performance.now() - goAt));
      scores.push(ms);
      roundIdx++;
      if (roundIdx >= 3) {
        finishGame();
      } else {
        setArena('round-done', '✨', `${ms} ms!`, `좋아요! 터치해서 ${roundIdx + 1}판 시작`);
        renderDots();
      }
      return;
    }
    if (state === 'finished') {
      resetAll();
      startRound();
    }
  });

  function resetAll() {
    clearTimeout(waitTimer);
    roundIdx = 0;
    scores = [];
    resultBox.classList.remove('show');
    setArena('idle', '⚡', '여기를 눌러 1판 시작', '3판 평균(ms)으로 오늘 내 반사신경을 측정합니다');
    renderDots();
  }

  document.getElementById('btn-retry').addEventListener('click', () => {
    resetAll();
    startRound();
  });

  document.getElementById('btn-share').addEventListener('click', () => {
    if (!lastAvg) return;
    const text = `⚡ [${mm}/${dd} 오늘의 반응속도 3판]\n내 평균: ${lastAvg} ms (${lastTier.title})\n(${scores.map((s, i) => `${i + 1}판 ${s}ms`).join(' · ')})\n\n너는 몇 ms 나옴? 똑같은 조건으로 도전해 봐 👇\nhttps://andigh456.github.io/k-mbti/play/reaction.html`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        toastEl.textContent = '✅ 단톡방 공유 문구가 복사되었어요!';
      }).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  });

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toastEl.textContent = '✅ 단톡방 공유 문구가 복사되었어요!';
  }

  document.getElementById('btn-img').addEventListener('click', () => {
    if (!lastAvg) return;
    const c = document.createElement('canvas');
    c.width = 900; c.height = 1120;
    const g = c.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 900, 1120);
    bg.addColorStop(0, '#13162b');
    bg.addColorStop(1, '#0b0c13');
    g.fillStyle = bg;
    g.fillRect(0, 0, 900, 1120);

    g.fillStyle = '#38d9a9';
    g.font = 'bold 34px sans-serif';
    g.textAlign = 'center';
    g.fillText(`⚡ ${mm}/${dd} 오늘의 반응속도 3판`, 450, 150);

    g.fillStyle = '#ffffff';
    g.font = '900 130px sans-serif';
    g.fillText(`${lastAvg} ms`, 450, 360);

    g.fillStyle = '#ffd43b';
    g.font = 'bold 42px sans-serif';
    g.fillText(lastTier.title, 450, 460);

    g.fillStyle = '#1e2133';
    g.fillRect(110, 560, 680, 220);
    g.strokeStyle = 'rgba(255,255,255,0.15)';
    g.lineWidth = 3;
    g.strokeRect(110, 560, 680, 220);

    g.fillStyle = '#9aa0b8';
    g.font = 'bold 28px sans-serif';
    g.fillText('1판              2판              3판', 450, 635);
    g.fillStyle = '#ffffff';
    g.font = '900 42px sans-serif';
    g.fillText(`${scores[0]}ms       ${scores[1]}ms       ${scores[2]}ms`, 450, 715);

    g.fillStyle = '#9aa0b8';
    g.font = 'bold 26px sans-serif';
    g.fillText('andigh456.github.io/k-mbti/play/reaction.html', 450, 1010);

    const url = c.toDataURL('image/png');
    document.getElementById('modal-img').src = url;
    document.getElementById('img-modal').classList.add('show');
  });
})();
</script>
</body>
</html>
